server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: fiverr-api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: fiverr-auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: fiverr-user-service
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**,/api/v1/profiles/**,/api/v1/sellers/**
        - id: fiverr-gig-service
          uri: ${GIG_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/gigs/**,/api/v1/categories/**
        - id: fiverr-order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**
        - id: fiverr-payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**,/api/v1/wallets/**
        - id: fiverr-messaging-service
          uri: ${MESSAGING_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/messages/**,/api/v1/conversations/**
        - id: fiverr-review-service
          uri: ${REVIEW_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/reviews/**
        - id: fiverr-notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/notifications/**
        - id: fiverr-search-service
          uri: ${SEARCH_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/v1/search/**

security:
  jwt:
    secret: ${JWT_SECRET:fiverr-club-super-secret-signing-key-must-be-at-least-256-bits-long-2026}
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/gigs/public
      - /api/v1/search
      - /actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
